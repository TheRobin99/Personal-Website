<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Project</title>
    <link rel="stylesheet" href="ProfileStyle.css">
    <script>
        function navigateTo(page) 
        {
            window.location.href = "pages/" + page + ".html";
        }       
    </script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: rgb(80, 80, 92);
                color: white;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: left;
                justify-content: flex-start;
                min-height: 100vh;
                text-align: left;
            }
    
            header {
                background-color: #333;
                color: white;
                padding: 1em 0;
                text-align: center;
            }
            footer {
                background-color: #333;
                color: white;
                text-align: center;
                padding: 1em 0;
                position: absolute; /* Position absolutely at the bottom */
                bottom: 0;
                width: 100%;
            }
    
            h1 {
                margin: 0;
                font-size: 2em;
                text-align: center;
            }
    
            main {
                padding: 20px;
            }
    
            .nav-buttons {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
                margin-top: 20px;
            }
    
            .nav-button {
                padding: 10px 20px;
                background-color: #4CAF50;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 1em;
                transition: background-color 0.3s ease;
            }
    
            .nav-button:hover {
                background-color: #367c39;
            }
            /* Add styling for larger screens */
            @media (min-width: 768px) {
                h1 {
                    font-size: 3em;
                }
                .nav-button {
                    font-size: 1.2em;
                    padding: 15px 30px;
                }
            }
            .center-image {
                display: block;
                margin-left: auto;
                margin-right: auto;
            }
        </style>
</head>
<body>
    <!-- add profile picture-->
   <header>
    <H1> Juan Acero </H1>
    </header>
<main>
    <img src="https://media.licdn.com/dms/image/v2/C5603AQHP_8ctUNmzHw/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1663294904568?e=1746057600&v=beta&t=aYK-_0Ozz3iPISWtUcS6vZzr9OgD8ob-NLMET1UmqtI"
    alt="" width="100" height="100" class="center-image">
    <div class="nav-buttons"> 
        <button class="nav-button" onclick="navigateTo('About me')">About Me</button>
        <button class="nav-button" onclick="navigateTo('Education')">Education</button>
        <button class="nav-button" onclick="navigateTo('Experience')">Experience</button>
        <button class="nav-button" onclick="navigateTo('Skills')">Skills</button>
        <button class="nav-button" onclick="navigateTo('Contact')">Contact</button>
    </div>
</main>
<footer>
    &copy; 2025 Juan Acero
</footer>
</body>
</html>
